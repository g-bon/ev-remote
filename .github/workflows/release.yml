name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    name: Signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The environment requires a manual approval and holds the signing secrets.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Check that the tag matches versionName
        run: |
          version=$(sed -nE "s/^ *versionName '([^']+)'.*/\1/p" android/app/build.gradle)
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match versionName ${version}"; exit 1; }
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Decode signing key
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "Missing RELEASE_KEYSTORE_BASE64"; exit 1; }
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ABRP_API_KEY: ${{ secrets.ABRP_API_KEY }}
        run: ./gradlew --no-daemon assembleGithubRelease

      - name: Verify signature and write checksums
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)/apksigner"
          mkdir dist
          cp android/app/build/outputs/apk/github/release/app-github-release.apk "dist/ev-remote-${VERSION}.apk"
          "$apksigner" verify --verbose --print-certs "dist/ev-remote-${VERSION}.apk" | tee dist/signature.txt
          (cd dist && sha256sum "ev-remote-${VERSION}.apk" > SHA256SUMS)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/ev-remote-${{ env.VERSION }}.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## ${VERSION}" 'index($0, v) == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" "dist/ev-remote-${VERSION}.apk" dist/SHA256SUMS \
            --title "EV Remote ${VERSION}" --notes-file notes.md --verify-tag

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
